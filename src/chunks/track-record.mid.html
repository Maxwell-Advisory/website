<script>
document.addEventListener("DOMContentLoaded", () => {
    const elements = document.querySelectorAll(".scroll-darken");
    if (!elements.length) return;

    // Découpe du texte
    elements.forEach(el => {
        const text = el.textContent;
        el.innerHTML = text.split("").map(ch => `<span>${ch}</span>`).join("");
    });

    // Animation automatique
    const autoAnimate = () => {
        elements.forEach(el => {
            const letters = el.querySelectorAll("span");
            letters.forEach((letter, i) => {
                setTimeout(() => {
                    letter.classList.add("is-dark");
                }, i * 17); // vitesse (20 ms entre chaque lettre)
            });
        });
    };

    autoAnimate();
});
</script>
